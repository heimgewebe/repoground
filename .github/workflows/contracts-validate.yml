name: "contracts-validate"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # Keep PR-specific groups to prevent cross-branch cancellations.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: {}
  push: {}
  pull_request: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  FAIL_ON_NO_BASE: "1"

jobs:
  immutable-ci-supply-chain:
    name: "Security: immutable GitHub Actions pins"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject mutable external Action references
        run: python3 scripts/ci/check_github_actions_pins.py

      - name: Validate reusable workflow caller contracts
        run: python3 scripts/ci/check_reusable_workflow_contracts.py

  version-sync-check:
    name: "Security: enforce static pin for contracts reusable workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify 'uses:' pins for heimgewebe/contracts-mirror
        env:
          REQUIRED_REPO: "heimgewebe/contracts-mirror/.github/workflows/contracts-ajv-reusable.yml"
          REQUIRED_REF: "968518ebbef3b36c008320d701c87473aa012a88"
        run: |
          set -euo pipefail
          shopt -s extglob

          WF_FILE=".github/workflows/contracts-validate.yml"
          [[ -f "$WF_FILE" ]] || { echo "::error::Workflow file not found"; exit 1; }

          uses_count=0
          contracts_ref_count=0
          mismatches=0

          while IFS= read -r line || [[ -n "$line" ]]; do
            clean_line="${line%%#*}"
            trimmed="${clean_line#"${clean_line%%[![:space:]]*}"}"

            if [[ "$trimmed" == uses:* ]]; then
              val="${trimmed#uses:}"
              val="${val#"${val%%[![:space:]]*}"}"
              val="${val%\"}"
              val="${val#\"}"
              val="${val%\'}"
              val="${val#\'}"

              if [[ "$val" == *"heimgewebe/contracts"* ]]; then
                uses_count=$((uses_count + 1))

                if [[ "$val" != *"@"* ]]; then
                  echo "::error file=$WF_FILE::uses reference missing @ symbol"
                  mismatches=1
                  continue
                fi

                repo="${val%@*}"
                ref="${val#*@}"

                if [[ "$repo" != "$REQUIRED_REPO" ]]; then
                  echo "::error file=$WF_FILE::Expected repository $REQUIRED_REPO but got $repo"
                  mismatches=1
                fi

                if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "::error file=$WF_FILE::uses ref must be a 40-character lowercase hex SHA, got $ref"
                  mismatches=1
                fi

                if [[ "$ref" != "$REQUIRED_REF" ]]; then
                  echo "::error file=$WF_FILE::uses ref mismatch. Expected $REQUIRED_REF, got $ref"
                  mismatches=1
                fi
              fi
            fi

            if [[ "$trimmed" == contracts_ref:* ]]; then
              contracts_ref_count=$((contracts_ref_count + 1))
              val="${trimmed#contracts_ref:}"
              val="${val#"${val%%[![:space:]]*}"}"
              val="${val%\"}"
              val="${val#\"}"
              val="${val%\'}"
              val="${val#\'}"

              if [[ ! "$val" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error file=$WF_FILE::contracts_ref must be a 40-character lowercase hex SHA, got $val"
                mismatches=1
              fi

              if [[ "$val" != "$REQUIRED_REF" ]]; then
                echo "::error file=$WF_FILE::contracts_ref mismatch. Expected $REQUIRED_REF, got $val"
                mismatches=1
              fi
            fi
          done < "$WF_FILE"

          if [[ $uses_count -ne 1 ]]; then
            echo "::error file=$WF_FILE::Expected exactly 1 uses caller for mirror, found $uses_count"
            mismatches=1
          fi

          if [[ $contracts_ref_count -ne 1 ]]; then
            echo "::error file=$WF_FILE::Expected exactly 1 contracts_ref input, found $contracts_ref_count"
            mismatches=1
          fi

          if [[ $mismatches -ne 0 ]]; then
            exit 1
          fi

          [[ $mismatches -eq 0 ]] || exit 1
          echo "::notice::✅ All version pins validated"

  guard:
    name: "Security: guard deletion policy (contracts)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      GH_EVENT_NAME: ${{ github.event_name }}
      GH_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_PUSH_BEFORE: ${{ github.event.before }}
      GH_REPOSITORY: ${{ github.repository }}
      GH_COMMIT_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      PROTECTED_REGEX: '^(merger/repoground/contracts/|docs/contracts/)'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce guard policy
        run: |
          set -euo pipefail
          is_truthy() { case "${1:-0}" in 1|true|yes|on) return 0 ;; esac; return 1; }

          pr_number="${GH_PR_NUMBER:-}"
          pr_head_sha="${GH_PR_HEAD_SHA:-}"
          pr_base_sha="${GH_PR_BASE_SHA:-}"
          if [[ "${GH_EVENT_NAME:-}" == "push" ]]; then
            if subject="$(
              python3 scripts/ci/check_contract_deletion_authorization.py \
                resolve-push-pr \
                --pull-requests-url \
                  "https://api.github.com/repos/${GH_REPOSITORY}/commits/${GH_COMMIT_SHA}/pulls" \
                --commit-sha "$GH_COMMIT_SHA"
            )"
            then
              read -r pr_number pr_head_sha pr_base_sha <<< "$subject"
            else
              echo "::warning::Could not resolve a complete associated pull-request set; failing closed"
              pr_number=""
              pr_head_sha=""
              pr_base_sha=""
            fi
          fi

          base=""
          base_src=""

          if [[ -n "$pr_base_sha" ]] \
            && git rev-parse --verify "${pr_base_sha}^{commit}" &>/dev/null
          then
            if mb="$(git merge-base "$pr_base_sha" HEAD 2>/dev/null)"; then
              base="$mb"
              base_src="merge-base(pr_base,HEAD)"
            fi
          fi

          if [[ -z "$base" \
            && -n "${GH_PUSH_BEFORE:-}" \
            && ! "${GH_PUSH_BEFORE}" =~ ^0{40}$ ]] \
            && git rev-parse --verify "${GH_PUSH_BEFORE}^{commit}" &>/dev/null
          then
            base="$GH_PUSH_BEFORE"
            base_src="push_before"
          fi

          if [[ -z "$base" ]]; then
            git fetch -q origin "$GH_DEFAULT_BRANCH" || true
            if git rev-parse "origin/${GH_DEFAULT_BRANCH}^{commit}" &>/dev/null; then
              if mb="$(git merge-base "origin/${GH_DEFAULT_BRANCH}" HEAD 2>/dev/null)"; then
                base="$mb"
                base_src="merge-base(origin/${GH_DEFAULT_BRANCH},HEAD)"
              fi
            fi
          fi

          if [[ -z "$base" ]]; then
            if is_truthy "${FAIL_ON_NO_BASE:-1}"; then
              echo "::error::Cannot determine merge-base"
              exit 1
            fi
            echo "::notice::No merge-base found - skipping guard"
            exit 0
          fi

          echo "::notice::Checking diff from ${base:0:8}...HEAD (source=$base_src)"

          blocked=()
          while IFS=$'\t' read -r -a fields; do
            status="${fields[0]}"
            p1="${fields[1]}"
            p2="${fields[2]:-}"
            [[ "$p1" =~ ${PROTECTED_REGEX} ]] || continue
            case "$status" in
              D) blocked+=("DELETE: $p1") ;;
              R*) blocked+=("RENAME: $p1 → ${p2:-(unknown destination)}") ;;
            esac
          done < <(git diff --name-status --diff-filter=DR "${base}...HEAD")

          if (( ${#blocked[@]} )); then
            blocked_sorted="$(printf '%s\n' "${blocked[@]}" | LC_ALL=C sort -u)"
            paths_sha256="$(printf '%s\n' "$blocked_sorted" | sha256sum | awk '{print $1}')"
            marker="/authorize-contract-removal pr=${pr_number} base=${base} head=${pr_head_sha} paths_sha256=${paths_sha256}"
            authorized=0

            if [[ -n "$pr_number" && -n "$pr_head_sha" ]]; then
              if python3 scripts/ci/check_contract_deletion_authorization.py \
                verify-comments \
                --comments-url \
                  "https://api.github.com/repos/${GH_REPOSITORY}/issues/${pr_number}/comments" \
                --marker "$marker"
              then
                authorized=1
              else
                echo "::warning::Could not verify the complete PR authorization comment set; failing closed"
              fi
            fi

            if (( authorized )); then
              echo "::notice::Exact protected-file removal authorization accepted"
              while IFS= read -r item; do
                printf '  • %s\n' "$item"
              done <<< "$blocked_sorted"
              exit 0
            fi

            echo "::group::❌ Protected file deletions blocked"
            while IFS= read -r item; do
              printf '  • %s\n' "$item"
            done <<< "$blocked_sorted"
            echo "::endgroup::"
            echo "::error::Guard violation"
            echo "::error::Required exact trusted-human comment: $marker"
            exit 1
          fi

          echo "::notice::✅ Guard passed"

  validate:
    name: "Validate fixtures via reusable workflow"
    needs: [version-sync-check, guard]
    uses: heimgewebe/contracts-mirror/.github/workflows/contracts-ajv-reusable.yml@968518ebbef3b36c008320d701c87473aa012a88
    secrets: inherit
    with:
      fixtures_glob: ${{ vars.FIXTURES_GLOB || 'merger/repoground/contracts/examples/**/*.json merger/repoground/contracts/examples/**/*.jsonl' }}
      contracts_ref: 968518ebbef3b36c008320d701c87473aa012a88
