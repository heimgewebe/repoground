---
name: RPU V1 T032 Hardened Evaluation V3

"on":
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/rpu-v1-t032-harden-v3.yml"

permissions:
  contents: write

jobs:
  harden-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Materialize revision-bound inputs
        shell: bash
        run: |
          test "$(sha256sum .github/rpu-t032/transformer.b64 | awk '{print $1}')" = "fea66eae443f40ce7befb30c20901c3c6aeadda3740435ee52523a190d99e736"
          test "$(sha256sum .github/rpu-t032/goldset.b64 | awk '{print $1}')" = "0c9de05e2042b2ff440e3b08d4c14da64f4e3fce52d13f7ed46079de666469ab"
          test "$(sha256sum .github/rpu-t032/proof.b64 | awk '{print $1}')" = "f9d905ff6707560804b54d9f1d79fe9e1af8d381e6ac5f9fbb42e829d8af92ac"
          mkdir -p .github/scripts docs/proofs
          base64 -d .github/rpu-t032/transformer.b64 | gzip -d > .github/scripts/apply_rpu_t032_hardening.py
          base64 -d .github/rpu-t032/goldset.b64 | gzip -d > /tmp/test_python_call_graph_s1_recall.py
          base64 -d .github/rpu-t032/proof.b64 | gzip -d > /tmp/repobrief-call-graph-s1-recall-v1.json
          test "$(sha256sum .github/scripts/apply_rpu_t032_hardening.py | awk '{print $1}')" = "7a53e5b680d12c21c3e41a7c984cfe02ee2713f0af3438cd6ff11591f467381d"
          test "$(sha256sum /tmp/test_python_call_graph_s1_recall.py | awk '{print $1}')" = "4057a65e512fd0bff70972e438779a02a0abf546af567ab4be7bb74f2025ba2c"
          test "$(sha256sum /tmp/repobrief-call-graph-s1-recall-v1.json | awk '{print $1}')" = "66707c4bd596de7f7787d28c515bd960dd955c7651c3c138d05fc1e848f5f268"
          python -m py_compile .github/scripts/apply_rpu_t032_hardening.py
          python -m py_compile /tmp/test_python_call_graph_s1_recall.py
          python -m json.tool /tmp/repobrief-call-graph-s1-recall-v1.json >/dev/null

      - name: Apply bounded hardening
        run: |
          python .github/scripts/apply_rpu_t032_hardening.py
          cp /tmp/test_python_call_graph_s1_recall.py merger/repoground/tests/test_python_call_graph_s1_recall.py
          cp /tmp/repobrief-call-graph-s1-recall-v1.json docs/proofs/repobrief-call-graph-s1-recall-v1.json

      - name: Install locked development dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/repoground-dev.lock.txt

      - name: Ruff verification
        run: |
          ruff check --fix merger/repoground/architecture/call_graph.py merger/repoground/tests/test_python_call_graph_s1_recall.py
          ruff check merger/repoground/architecture/call_graph.py merger/repoground/tests/test_python_call_graph_s1_recall.py
          test "$(sha256sum merger/repoground/tests/test_python_call_graph_s1_recall.py | awk '{print $1}')" = "4057a65e512fd0bff70972e438779a02a0abf546af567ab4be7bb74f2025ba2c"
          test "$(sha256sum docs/proofs/repobrief-call-graph-s1-recall-v1.json | awk '{print $1}')" = "66707c4bd596de7f7787d28c515bd960dd955c7651c3c138d05fc1e848f5f268"

      - name: Focused producer and goldset tests
        run: |
          python -m pytest -q merger/repoground/tests/test_python_call_graph.py merger/repoground/tests/test_python_call_graph_s1_recall.py

      - name: Verify bounded diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'merger/repoground/architecture/call_graph.py\nmerger/repoground/tests/test_python_call_graph_s1_recall.py'
          test "$changed" = "$expected"
          untracked="$(git ls-files --others --exclude-standard | sort)"
          expected_untracked=$'.github/scripts/apply_rpu_t032_hardening.py\ndocs/proofs/repobrief-call-graph-s1-recall-v1.json'
          test "$untracked" = "$expected_untracked"

      - name: Commit and publish hardened implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/apply_rpu_t032_hardening.py
          rmdir .github/scripts 2>/dev/null || true
          git add merger/repoground/architecture/call_graph.py merger/repoground/tests/test_python_call_graph_s1_recall.py docs/proofs/repobrief-call-graph-s1-recall-v1.json
          git commit -m "fix(call-graph): harden S1 recall evaluation"
          git push origin HEAD:feat/repobrief-call-graph-s1-recall-v1
