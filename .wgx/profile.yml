---
# WGX profile for heimgewebe/repoground
profile: repoground
description: "RepoGround Knowledge Compiler & Evidence Runtime"

# Semantic version of the repository WGX profile (not the wgx CLI version).
wgx-version: ">=1.0.0"

# Primary product surface for fleet tools; implementation languages are listed below.
class: knowledge-compiler

wgx:
  apiVersion: v1

lang:
  - python
  - shell

meta:
  org: heimgewebe
  repo: heimgewebe/repoground
  maintainer: alexdermohr@gmail.com
  tags:
    - repoground
    - knowledge-compiler
    - evidence-runtime
    - repository-analysis
    - wgx
  ci: true

env:
  WGX_METRICS_OUTPUT: "metrics.json"

tasks:
  smoke: |
    echo "[wgx.smoke] repoground – schneller Grundcheck"
    if [ -f scripts/wgx-metrics-snapshot.sh ]; then
      bash scripts/wgx-metrics-snapshot.sh --json || echo "[wgx.smoke] metrics-snapshot optional fehlgeschlagen"
    else
      echo "[wgx.smoke] kein scripts/wgx-metrics-snapshot.sh gefunden – skip."
    fi

  guard: |
    set -euo pipefail
    echo "[wgx.guard] repoground – aktive Skript- und Metadatenflächen prüfen…"
    if [ -f scripts/wgx-metrics-snapshot.sh ]; then
      bash -n scripts/wgx-metrics-snapshot.sh
      if command -v shellcheck >/dev/null 2>&1; then
        shellcheck scripts/wgx-metrics-snapshot.sh
      else
        echo "[wgx.guard] shellcheck nicht installiert – nur bash -n ausgeführt."
      fi
    else
      echo "[wgx.guard] scripts/wgx-metrics-snapshot.sh fehlt – nichts zu prüfen."
    fi

  metrics: |
    echo "[wgx.metrics] repoground – metrics-Snapshot (best effort)…"
    if [ -f scripts/wgx-metrics-snapshot.sh ]; then
      bash scripts/wgx-metrics-snapshot.sh --json || echo "[wgx.metrics] metrics-snapshot fehlgeschlagen."
    else
      echo "[wgx.metrics] kein metrics-Skript vorhanden – skip."
    fi

  snapshot: |
    echo "[wgx.snapshot] repoground – Snapshot (best effort)…"
    if [ -f scripts/wgx-metrics-snapshot.sh ]; then
      bash scripts/wgx-metrics-snapshot.sh --json || true
    fi
